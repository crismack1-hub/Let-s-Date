services:
  - type: web
    name: lets-date-backend
    env: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/connect.sqlite
      - key: CORS_ORIGIN
        value: https://let-s-date.vercel.app
    disk:
      name: lets-date-data
      mountPath: /var/data
      sizeGB: 1
